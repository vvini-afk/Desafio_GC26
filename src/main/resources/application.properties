spring.application.name=RecommedationEngine
spring.datasource.url=${DB_URL:jdbc:h2:mem:recomendacao;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
integrations.open-meteo.geocoding-url=${OPEN_METEO_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
integrations.open-meteo.forecast-url=${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
integrations.brasil-api.base-url=${BRASIL_API_BASE_URL:https://brasilapi.com.br}
