spring.application.name=RecommedationEngine
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema Supabase existente
spring.flyway.clean-disabled=true
integrations.open-meteo.geocoding-url=${OPEN_METEO_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
integrations.open-meteo.forecast-url=${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
integrations.brasil-api.base-url=${BRASIL_API_BASE_URL:https://brasilapi.com.br}

recommendation.context.temperature-hot-celsius=${REC_TEMPERATURE_HOT_CELSIUS:24}
recommendation.context.temperature-cold-celsius=${REC_TEMPERATURE_COLD_CELSIUS:18}
recommendation.context.rain-minimum-mm=${REC_RAIN_MINIMUM_MM:0.5}
recommendation.context.holiday-window-days=${REC_HOLIDAY_WINDOW_DAYS:7}
recommendation.context.weather-points=${REC_WEATHER_POINTS:8}
recommendation.context.cold-points=${REC_COLD_POINTS:10}
recommendation.context.rain-points=${REC_RAIN_POINTS:6}
recommendation.context.holiday-points=${REC_HOLIDAY_POINTS:7}
recommendation.context.hot-categories=${REC_HOT_CATEGORIES:0101 - REFRIGERANTE PET|0102 - REFRIGERANTE VIDRO|0103 - REFRIGERANTE LATA|0104 - AGUAS|0105 - CITRUS|0106 - AGUA 20 LITROS|0107 - AGUA 5 LITROS|0108 - AGUA SABORIZADA|0109 - SUCOS|0114 - ENERGETICO LATA|0115 - ENERGETICO PET}
recommendation.context.cold-categories=${REC_COLD_CATEGORIES:0117 - VINHO VIDRO|0105 - CITRUS|0109 - SUCOS}
recommendation.context.rain-categories=${REC_RAIN_CATEGORIES:0101 - REFRIGERANTE PET|0109 - SUCOS|0117 - VINHO VIDRO}
recommendation.context.holiday-categories=${REC_HOLIDAY_CATEGORIES:0101 - REFRIGERANTE PET|0102 - REFRIGERANTE VIDRO|0103 - REFRIGERANTE LATA|0105 - CITRUS|0109 - SUCOS|0112 - CERVEJA VIDRO|0113 - CERVEJA LATA|0117 - VINHO VIDRO}
