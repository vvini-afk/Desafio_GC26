spring.application.name=RecommedationEngine
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema Supabase existente
spring.flyway.clean-disabled=true
integrations.open-meteo.geocoding-url=${OPEN_METEO_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
integrations.open-meteo.forecast-url=${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
integrations.brasil-api.base-url=${BRASIL_API_BASE_URL:https://brasilapi.com.br}

recommendation.context.temperature-hot-celsius=${REC_TEMPERATURE_HOT_CELSIUS:27}
recommendation.context.temperature-cold-celsius=${REC_TEMPERATURE_COLD_CELSIUS:18}
recommendation.context.rain-minimum-mm=${REC_RAIN_MINIMUM_MM:0.5}
recommendation.context.holiday-window-days=${REC_HOLIDAY_WINDOW_DAYS:7}
recommendation.context.weather-points=${REC_WEATHER_POINTS:8}
recommendation.context.holiday-points=${REC_HOLIDAY_POINTS:7}
recommendation.context.hot-categories=${REC_HOT_CATEGORIES:Bebidas geladas|Sorvetes|Praia|Verão}
recommendation.context.cold-categories=${REC_COLD_CATEGORIES:Bebidas quentes|Cafés|Chás|Sopas|Agasalhos|Inverno}
recommendation.context.rain-categories=${REC_RAIN_CATEGORIES:Guarda-chuva|Capa de chuva|Galochas}
recommendation.context.holiday-categories=${REC_HOLIDAY_CATEGORIES:Presentes|Festas|Decoração|Viagem|Alimentos}
